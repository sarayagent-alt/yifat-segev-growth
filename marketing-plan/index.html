<script>
const payload = JSON.parse(document.getElementById('encrypted-plan').textContent);
const form = document.getElementById('unlock');
const input = document.getElementById('password');
const error = document.getElementById('unlock-error');
const submit = form.querySelector('button');
const decode = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));

function accessStore(operation, key) {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('yifat-plan-access', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('access');
    request.onerror = () => reject(request.error);
    request.onsuccess = () => {
      const database = request.result;
      const transaction = database.transaction('access', operation === 'read' ? 'readonly' : 'readwrite');
      const store = transaction.objectStore('access');
      const item = operation === 'read' ? store.get('plan') :
        operation === 'save' ? store.put(key, 'plan') : store.delete('plan');
      let result;
      item.onsuccess = () => { result = item.result; };
      transaction.oncomplete = () => { database.close(); resolve(result); };
      transaction.onerror = () => { database.close(); reject(transaction.error); };
      transaction.onabort = () => { database.close(); reject(transaction.error); };
    };
  });
}

async function openPlan(material) {
  const key = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', hash: 'SHA-256', salt: decode(payload.salt), iterations: payload.iterations},
    material, {name: 'AES-GCM', length: 256}, false, ['decrypt']
  );
  const plan = await crypto.subtle.decrypt(
    {name: 'AES-GCM', iv: decode(payload.iv)}, key, decode(payload.ciphertext)
  );
  return new TextDecoder().decode(plan);
}

function displayPlan(html) {
  input.value = '';
  document.open();
  document.write(html);
  document.close();
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (submit.disabled) return;
  submit.disabled = true;
  error.hidden = true;
  try {
    const material = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(input.value.trim()), 'PBKDF2', false, ['deriveKey']
    );
    const html = await openPlan(material);
    await accessStore('save', material).catch(() => {});
    displayPlan(html);
  } catch {
    error.textContent = 'הסיסמה שגויה. נסי שוב.';
    error.hidden = false;
    input.focus();
    input.select();
  } finally {
    submit.disabled = false;
  }
});

async function restoreAccess() {
  submit.disabled = true;
  try {
    const material = await accessStore('read');
    if (material) displayPlan(await openPlan(material));
  } catch {
    await accessStore('delete').catch(() => {});
  } finally {
    submit.disabled = false;
  }
}
restoreAccess();

</script>
