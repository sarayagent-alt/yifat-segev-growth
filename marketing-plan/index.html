<script>
const payload = JSON.parse(document.getElementById('encrypted-plan').textContent);
const form = document.getElementById('unlock');
const input = document.getElementById('password');
const error = document.getElementById('unlock-error');
const submit = form.querySelector('button');

function decode(value) {
  return Uint8Array.from(atob(value), (character) => character.charCodeAt(0));
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (submit.disabled) return;
  submit.disabled = true;
  error.hidden = true;
  if (!window.isSecureContext || !window.crypto?.subtle) {
    error.textContent = 'פתיחת התוכנית דורשת חיבור מאובטח ודפדפן עדכני.';
    error.hidden = false;
    submit.disabled = false;
    return;
  }
  try {
    const material = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(input.value.trim()), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', hash: 'SHA-256', salt: decode(payload.salt), iterations: payload.iterations},
      material, {name: 'AES-GCM', length: 256}, false, ['decrypt']
    );
    const plan = await crypto.subtle.decrypt(
      {name: 'AES-GCM', iv: decode(payload.iv)}, key, decode(payload.ciphertext)
    );
    const html = new TextDecoder().decode(plan);
    input.value = '';
    document.open();
    document.write(html);
    document.close();
    if (location.hash) {
      const target = document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView();
    }
  } catch {
    error.textContent = 'הסיסמה שגויה. נסי שוב.';
    error.hidden = false;
    input.focus();
    input.select();
  } finally {
    submit.disabled = false;
  }
});
</script>
